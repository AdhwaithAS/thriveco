# ---------------------------------------------------------------------------
# Neon PostgreSQL profile (default)
# ---------------------------------------------------------------------------
# Set these in .env or in your hosting provider's environment variables.
#
# DB_URL=jdbc:postgresql://<host>/neondb?sslmode=require&channel_binding=require
# DB_USER=neondb_owner
# DB_PASSWORD=<your-database-password>
#
# Use the pooled Neon host (the one containing "-pooler") for serverless
# connections. It keeps connection counts low and handles Neon cold starts.

spring.datasource.url=${DB_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neondb}}}
spring.datasource.username=${DB_USER:${DATABASE_USER:${SPRING_DATASOURCE_USERNAME:neondb_owner}}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.idle-timeout=300000
