# ---------------------------------------------------------------------------
# Local profile - embedded H2 database, no Neon/Internet required
# Run with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:h2:file:./data/thriveco;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update

# Helpful while developing: browse the embedded DB at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
