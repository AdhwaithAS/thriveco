# ---------------------------------------------------------------------------
# THRIVE&CO - common application settings
# ---------------------------------------------------------------------------

spring.application.name=thrive-and-co
server.port=${PORT:8080}
server.shutdown=graceful

# Load a local .env file if it exists. The [.properties] hint tells Spring Boot
# to parse KEY=VALUE lines, which is exactly the .env format.
# Environment variables still take precedence, so this is safe for deployment.
spring.config.import=optional:file:./.env[.properties],optional:file:./.env.local[.properties]

# Default to the Neon (PostgreSQL) profile. For a zero-setup local demo run:
#   ./run.sh local
spring.profiles.default=neon

# JPA / JSON
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Error handling is performed by GlobalExceptionHandler
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.root=INFO
logging.level.com.marian.thriveco=INFO
